<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trippie Chomp</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./assets/fonts/PressStart2P-latin.woff2') format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100dvh;
      overflow: hidden;
      background: #0D0D1A;
      font-family: 'Press Start 2P', monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    #game-container canvas {
      image-rendering: pixelated;
      border-radius: 12px;
      max-height: calc(100dvh - 8px);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "724f654dbf97465bbb2d8120e1161ec9"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
